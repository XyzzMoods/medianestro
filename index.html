<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Media Nestro - Indonesia</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
  body { background:#0b0b0b; }
  .orange { color:#ff7a00; }

  .fade-out {
    opacity: 0;
    transform: translateY(10px);
    transition: all .2s ease;
  }

  .fade-in {
    opacity: 1;
    transform: translateY(0);
    transition: all .3s ease;
  }

  .tab-active {
    border: 1px solid #ff7a00;
    color: #ff7a00;
  }
  
  #app {
  opacity: 0;
  transform: translateY(25px);
  transition: all 0.7s ease;
}

#app.show {
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>

<body class="text-white">

<!-- INTRO SCREEN -->
<div id="intro" class="fixed inset-0 z-50 flex items-end justify-center">

  <!-- BACKGROUND IMAGE -->
  <img
    src="https://raw.githubusercontent.com/IkyyEzzXD/IkyyGantengPoll/main/uploads/1780754493786_file_6648.jpg"
    class="absolute w-full h-full object-cover"
  />

  <!-- DARK OVERLAY -->
  <div class="absolute inset-0 bg-black/60"></div>

  <!-- BUTTON OVER IMAGE -->
  <button onclick="closeIntro()"
  class="relative mb-10 px-16 py-4 w-[260px] border border-orange-500 text-orange-500 font-semibold rounded-full bg-black/40 backdrop-blur-sm text-lg tracking-wide
         hover:bg-orange-500 hover:text-black transition duration-300 flex items-center justify-center gap-2">

  Lanjut
  <i class="fa-solid fa-arrow-right"></i>

</button>

</div>

<div id="app">

<!-- HEADER -->
<header class="p-5 border-b border-gray-800 flex flex-col md:flex-row justify-between gap-3 md:items-center">

  <div class="flex items-center gap-3">
    <img src="https://raw.githubusercontent.com/IkyyEzzXD/IkyyGantengPoll/main/uploads/1780757879928_file_6651.jpg"
     class="w-8 h-8 rounded-full object-cover" />
    <h1 class="text-2xl font-bold">
      <span class="text-orange-500">Media</span>
      <span class="text-white"> Nestro</span>
    </h1>
  </div>

  <div class="relative w-full md:w-80">
    <i class="fa-solid fa-search absolute left-3 top-2.5 text-gray-500"></i>
    <input id="search"
      class="bg-gray-900 w-full pl-9 pr-3 py-2 rounded text-sm outline-none"
      placeholder="Search crypto news..."/>
  </div>
</header>

<!-- TABS -->
<div class="p-4 flex gap-3 overflow-x-auto border-b border-gray-800 text-sm">

<button id="tab-all" onclick="setMode('all')" 
  class="px-3 py-1 bg-gray-900 rounded border border-gray-700 flex items-center gap-2">

  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 36 36">
    <path fill="#ff7a00" d="M20.25 26H6v2.2h14.25a1.1 1.1 0 0 0 0-2.2Z"/>
    <path fill="#ff7a00" d="M28 20H6v2.2h22a1.1 1.1 0 0 0 0-2.2Z"/>
    <path fill="#ff7a00" d="M22.6 15.1a1.1 1.1 0 0 0-1.1-1.1H6v2.2h15.5a1.1 1.1 0 0 0 1.1-1.1Z"/>
    <path fill="#ff7a00" d="M29.25 8H6v2.2h23.25a1.1 1.1 0 1 0 0-2.2Z"/>
  </svg>

  <span class="text-sm text-white">All</span>

</button>

<button id="tab-latest" onclick="setMode('latest')" 
  class="px-3 py-1 bg-gray-900 rounded border border-gray-700 flex items-center gap-2">

  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 36 36" fill="#ff7a00"><path fill="#ff7a00" d="M10.52 34h-3a1 1 0 0 1-.88-1.44L12.55 21H6a1 1 0 0 1-.85-1.54l10.68-17a1 1 0 0 1 .81-.46h13.43a1 1 0 0 1 .77 1.69L21.78 14h5.38a1 1 0 0 1 .73 1.66l-16.63 18a1 1 0 0 1-.74.34Zm-1.34-2h.91l14.77-16h-5.27a1 1 0 0 1-.77-1.69L27.88 4H17.19L7.77 19h6.43a1 1 0 0 1 .88 1.44Z" class="clr-i-outline clr-i-outline-path-1"/><path fill="none" d="M0 0h36v36H0z"/></svg>

  <span class="text-sm text-white">Latest</span>

</button>

<button id="tab-trending" onclick="setMode('trending')" 
  class="px-3 py-1 bg-gray-900 rounded border border-gray-700 flex items-center gap-2">

  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 36 36">
    <path fill="#ff7a00" d="M32 5H4a2 2 0 0 0-2 2v22a2 2 0 0 0 2 2h28a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2ZM4 29V7h28v22Z"/>
    <path fill="#ff7a00" d="M7 10h6v16h-1.6V11.6H8.6V26H7Z"/>
    <path fill="#ff7a00" d="M15 19h6v7h-1.6v-5.4h-2.8V26H15Z"/>
    <path fill="#ff7a00" d="M23 16h6v10h-1.6v-8.4h-2.8V26H23Z"/>
  </svg>

  <span class="text-sm text-white">Trending</span>

</button>

<button id="tab-hot" onclick="setMode('hot')" 
  class="px-3 py-1 bg-gray-900 rounded border border-gray-700 flex items-center gap-2">

  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 36 36" fill="#ff7a00"><path fill="#ff7a00" d="M31.3 16.66c-1.19-2.09-7.94-14.15-7.94-14.15a1 1 0 0 0-1.75 0l-6 10.64l-3-5.28a1 1 0 0 0-1.75 0S5.4 17.78 4.42 19.5A9.3 9.3 0 0 0 3 24.61C3 29.72 5.86 34 11.67 34h10.81C28.28 34 33 29 33 22.78a11.13 11.13 0 0 0-1.7-6.12ZM22.48 32H11.77C8.13 32 5 28.66 5 24.61a7.43 7.43 0 0 1 1.16-4.13c.73-1.29 4.05-7.21 5.65-10.07l3 5.28a1 1 0 0 0 .87.51a1 1 0 0 0 .87-.51L22.49 5c1.86 3.33 6.15 11 7.07 12.6A9.24 9.24 0 0 1 31 22.78c0 5.09-3.82 9.22-8.52 9.22Z" class="clr-i-outline clr-i-outline-path-1"/><path fill="#ff7a00" d="m25.75 21.73l-4.38-7.81a.8.8 0 0 0-1.4 0l-4.2 7.48l-1.59-2.49a.8.8 0 0 0-1.35 0l-3.46 5.44a4.35 4.35 0 0 0-.82 2.6a4.49 4.49 0 0 0 .5 2H11a3 3 0 0 1-.83-2a2.78 2.78 0 0 1 .56-1.73l2.8-4.38l1.66 2.6a.8.8 0 0 0 1.41-.12a7.82 7.82 0 0 1 .4-.8L20.67 16l3.69 6.57a4.83 4.83 0 0 1 .77 2.71A5 5 0 0 1 23.46 29h2.13a6.68 6.68 0 0 0 1.14-3.74a6.45 6.45 0 0 0-1-3.5Z" class="clr-i-outline clr-i-outline-path-2"/><path fill="none" d="M0 0h36v36H0z"/></svg>

  <span class="text-sm text-white">Hot</span>

</button>

</div>

<!-- STATUS -->
<div class="p-3 text-center">
  <span class="inline-flex items-center gap-2 text-white text-sm">
    <i class="fa-solid fa-circle animate-pulse text-[#ff1a1a] text-xs"></i>
    Live Media Feed
  </span>
</div>

<!-- LIST -->
<main id="news" class="grid gap-5 p-5 md:grid-cols-3"></main>

<!-- DETAIL VIEW -->
<section id="detail" class="hidden p-5 max-w-3xl mx-auto">

  <button onclick="closeDetail()" class="text-orange-400 text-sm mb-4">
    <i class="fa-solid fa-arrow-left"></i> Back
  </button>

  <img id="d_img" class="w-full h-64 object-cover border border-gray-800"/>

  <h1 id="d_title" class="text-xl font-bold text-orange-300 mt-4"></h1>

  <p id="d_date" class="text-xs text-gray-500 mt-1"></p>

  <div id="d_desc" class="mt-4 text-gray-300 text-sm leading-relaxed"></div>

  <a id="d_link" target="_blank"
     class="inline-block mt-5 text-orange-400 text-sm">
     Read original source →
  </a>

</section>

<script>

const sources = [
  "https://app.chaingpt.org/rssfeeds.xml",
  "https://cointelegraph.com/rss",
  "https://www.coindesk.com/arc/outboundfeeds/rss/",
  "https://news.bitcoin.com/feed/",
  "https://decrypt.co/feed",
  "https://cryptoslate.com/feed/",
  "https://beincrypto.com/feed/"
];

let allNews = [];
let mode = "all";

// IMAGE
function getImage(item) {
  if (item.enclosure?.link) return item.enclosure.link;
  if (item.thumbnail) return item.thumbnail;

  if (item.content) {
    const m = item.content.match(/<img.*src=['"](.*?)['"]/);
    if (m) return m[1];
  }

  return "https://via.placeholder.com/600x400/111/ff7a00?text=Media+Nestro";
}

// FETCH
async function fetchSource(url) {
  try {
    const api = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url);
    const res = await fetch(api);
    const data = await res.json();
    return data.items || [];
  } catch {
    return [];
  }
}

// CLEAN
function clean(data) {
  const seen = new Set();
  return data.filter(n => {
    const k = n.title?.toLowerCase();
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}

// LOAD
async function loadNews() {
  const res = await Promise.all(sources.map(fetchSource));
  allNews = clean(res.flat());
  render(true);
}

// SCORE
function getScore(item) {
  const t = (item.title || "").toLowerCase();
  let s = 0;

  if (t.includes("bitcoin")) s += 5;
  if (t.includes("ethereum")) s += 4;
  if (t.includes("hack")) s += 6;
  if (t.includes("etf")) s += 5;

  const age = (new Date() - new Date(item.pubDate)) / 3600000;
  s += Math.max(0, 10 - age);

  return s;
}

// MODE
function setMode(m) {
  mode = m;

  ["all","latest","trending","hot"].forEach(id => {
    document.getElementById("tab-"+id).classList.remove("tab-active");
  });

  document.getElementById("tab-"+m).classList.add("tab-active");

  render(true);
}

// RENDER
function render(animate = false) {
  const el = document.getElementById("news");

  if (animate) el.classList.add("fade-out");

  setTimeout(() => {

    let data = [...allNews];

    if (mode === "latest") {
      data.sort((a,b)=> new Date(b.pubDate) - new Date(a.pubDate));
    }

    if (mode === "trending") {
      data.forEach(n => n.score = getScore(n));
      data.sort((a,b)=> b.score - a.score);
    }

    if (mode === "hot") {
      data = data.filter(n =>
        (n.title||"").toLowerCase().includes("bitcoin") ||
        (n.title||"").toLowerCase().includes("hack") ||
        (n.title||"").toLowerCase().includes("etf")
      );
    }

    if (mode === "all") {
      data.sort((a,b)=> new Date(b.pubDate) - new Date(a.pubDate));
    }

    el.innerHTML = "";

    data.forEach(item => {
      const img = getImage(item);

      const card = document.createElement("div");
      card.className = "bg-gray-900 rounded-xl overflow-hidden border border-gray-800";

      card.style.cursor = "pointer";

      card.innerHTML = `
        <img src="${img}" class="w-full h-48 object-cover"/>

        <div class="p-4">

          <div class="flex justify-between items-center mb-2">
            <i class="fa-solid fa-newspaper text-orange-500"></i>
            <span class="text-xs text-gray-500">${mode.toUpperCase()}</span>
          </div>

          <h2 class="text-orange-300 font-semibold text-sm mb-2">
            ${item.title}
          </h2>

          <p class="text-gray-400 text-xs mb-3">
            ${item.description?.replace(/<[^>]*>/g,'').slice(0,110) || ""}...
          </p>

        </div>
      `;

      // CLICK → DETAIL
      card.onclick = () => showDetail(item, img);

      el.appendChild(card);
    });

    el.classList.remove("fade-out");

  }, animate ? 150 : 0);
}

// DETAIL
function showDetail(item, img) {
  document.getElementById("news").classList.add("hidden");
  document.getElementById("detail").classList.remove("hidden");

  document.getElementById("d_img").src = img;
  document.getElementById("d_title").innerText = item.title;
  document.getElementById("d_date").innerText = new Date(item.pubDate).toLocaleString();
  document.getElementById("d_desc").innerHTML = item.description?.replace(/<[^>]*>/g,'') || "";
  document.getElementById("d_link").href = item.link;
}

// BACK
function closeDetail() {
  document.getElementById("detail").classList.add("hidden");
  document.getElementById("news").classList.remove("hidden");
}

// SEARCH
document.getElementById("search").addEventListener("input", (e) => {
  const v = e.target.value.toLowerCase();

  const filtered = allNews.filter(n =>
    n.title.toLowerCase().includes(v)
  );

  const el = document.getElementById("news");
  el.innerHTML = "";

  filtered.forEach(item => {
    const img = getImage(item);

    const card = document.createElement("div");
    card.className = "bg-gray-900 rounded-xl overflow-hidden border border-gray-800";
    card.style.cursor = "pointer";

    card.innerHTML = `
      <img src="${img}" class="w-full h-48 object-cover"/>
      <div class="p-4 text-orange-300 text-sm font-semibold">
        ${item.title}
      </div>
    `;

    card.onclick = () => showDetail(item, img);

    el.appendChild(card);
  });
});

// INIT
loadNews();
setMode("all");
setInterval(loadNews, 120000);

</script>
<script>
function closeIntro() {
  const intro = document.getElementById("intro");
  const app = document.getElementById("app");

  intro.style.opacity = "0";
  intro.style.transform = "scale(1.05)";
  intro.style.transition = "all 0.6s ease";

  setTimeout(() => {
    intro.style.display = "none";
    app.classList.add("show");
  }, 500);

  sessionStorage.setItem("nestro_intro", "seen");
}

window.addEventListener("load", () => {
  const app = document.getElementById("app");
  const intro = document.getElementById("intro");

  if (sessionStorage.getItem("nestro_intro") === "seen") {
    intro.style.display = "none";
    app.classList.add("show");
  } else {
    // IMPORTANT: pastikan app tidak muncul duluan
    app.classList.remove("show");
  }
});
</script>

</div>
</body>
</html>
